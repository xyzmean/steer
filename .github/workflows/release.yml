name: Релиз

# Сборка и публикация по кнопке. От человека нужна одна вещь — номер версии.
#
# Почему не по тегу и не по push в main: движок собирается под шесть архитектур, и каждая
# расширенная сборка компилирует mbedtls целиком. Это десятки минут, и запускать это на
# каждый коммит значит либо ждать, либо привыкнуть к красным галочкам. Релиз — событие
# редкое и намеренное, кнопка ему соответствует.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 0.7.0). Ставится в VERSION и в тег vX.Y.Z'
        required: true
        type: string
      prerelease:
        description: 'Черновик для проверки: пометить как pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Два релиза одновременно перезаписали бы VERSION друг под другом и выложили бы пакеты
  # от разных сборок под одним тегом.
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Шесть архитектур, и в каждой расширенной сборке mbedtls компилируется заново.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Проверить формат версии
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # Значение приходит через env, а не подстановкой в текст скрипта. Выражения
          # GitHub раскрываются ДО запуска оболочки, то есть проверка формата ниже
          # стоит уже после того, как значение стало кодом: кавычка во входных данных
          # ломала бы разбор всего шага.
          #
          # Записывать здесь пример такого выражения нельзя даже в комментарии: GitHub
          # разбирает их по всему тексту шага, включая комментарии оболочки, и пустое
          # выражение — это «Invalid workflow file: an expression was expected». Ровно
          # на этом workflow и упал.
          V="$INPUT_VERSION"
          # Строгая проверка здесь, а не «как-нибудь потом»: версия попадает и в имена
          # файлов, и в тег, и в ?v= бандлов у splify2. Опечатка расходится по всем трём.
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::версия '$V' не в виде X.Y.Z"; exit 1; }
          echo "$V" > VERSION
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Стенды
        run: |
          set -eu
          # Вариант «а» из splicicd#14: падение стенда гасит релиз. До этого шага
          # release.yml не звал `make test` вовсе — ни целиком, ни подмножеством, —
          # то есть единственным сторожем стендов был ручной прогон. У splify2 это
          # уже стоило четырёх релизов с красным ui-harness; здесь цена была бы выше:
          # красный стенд движка означает красный движок на роутере.
          #
          # Цель `test` целиком, а не подмножество: ей не нужны ни root, ни сеть
          # наружу, ни пространства имён — dnsproxy.sh крутит живой резолвер по петле
          # (об этом сказано в его шапке), остальное считает в памяти. Значит «зелено
          # в CI» здесь означает то же, что «зелено локально», и оговорка про
          # подмножество не нужна.
          #
          # Чего в этом шаге НЕТ и почему: `make ext-test` — стенды src/ext на настоящем
          # mbedtls (xsloop, spokematch, hubmatch). Здесь их прогонять нечем: на runner'е
          # своя версия библиотеки, а нужна та, которой собирается расширенный пакет.
          # Они идут отдельным шагом ниже, ВНУТРИ образа сборки (R-063).
          make test

      - name: Собрать пакеты
        run: |
          set -eu
          # pipefail обязателен: без него код шага — это код tee, и падение самого
          # build.sh (нет docker, не собрался образ) шаг не заваливает вовсе.
          set -o pipefail
          # build.sh сам поднимает образ сборщика из build/Dockerfile, если его нет.
          ./build.sh 2>&1 | tee /tmp/build.log

      - name: Убедиться, что ни одна архитектура не отвалилась
        run: |
          set -eu
          # build.sh печатает FAILED и ИДЁТ ДАЛЬШЕ — это верно для локальной работы, но в
          # релизе молча выложить пять пакетов из двенадцати нельзя: человек скачает свой
          # и не найдёт, а в логе давно никто не смотрит.
          # Ловятся ОБА вида отказа. FAILED печатает только компиляция; упаковка
          # сообщает о себе другими словами («не удалась», «packaging failed»), и барьер,
          # искавший одно слово, пропускал ровно тот случай, ради которого стоит: apk
          # mkpkg упал на трёх архитектурах, релиз опубликован с девятью пакетами.
          if grep -qE 'FAILED|не удалась|packaging failed' /tmp/build.log; then
            echo "::error::часть архитектур не собралась или не упаковалась:"
            grep -E 'FAILED|не удалась|packaging failed' /tmp/build.log
            exit 1
          fi
          # Ожидаемое число считается из самого build.sh, а не вписано сюда числом:
          # список архитектур меняется, и константа разошлась бы с ним молча. На каждую
          # архитектуру два пакета — базовый и extended — и это в КАЖДОМ из двух форматов.
          arch_n=$(sed -n '/^ISAS="/,/^"$/p' build.sh | grep -c '^[a-z0-9_.-]*:')
          want=$((arch_n * 2))
          for ext in apk ipk; do
            n=$(ls out/*."$ext" 2>/dev/null | wc -l)
            [ "$n" -eq "$want" ] || {
              echo "::error::пакетов .$ext — $n, а ожидалось $want (архитектур $arch_n × 2)"
              ls -la out/ 2>/dev/null
              exit 1; }
            echo "собрано .$ext: $n из $want ожидаемых"
          done
          # Серверная половина: по архиву на каждую VPS-архитектуру из build.sh. Список
          # берётся оттуда же по той же причине — чтобы не разойтись молча.
          vps_n=$(sed -n '/^for arch in .* do$/{/aarch64_generic/p}' build.sh | head -1 |
                  sed 's/^for arch in //; s/; *do$//' | wc -w)
          [ "$vps_n" -ge 1 ] || { echo "::error::не нашёл список VPS-архитектур в build.sh"; exit 1; }
          t=$(ls out/steer-obfs-*.tar.gz 2>/dev/null | wc -l)
          [ "$t" -eq "$vps_n" ] || {
            echo "::error::архивов steer-obfs $t, а ожидалось $vps_n"
            ls -la out/ 2>/dev/null
            exit 1; }
          echo "собрано архивов steer-obfs: $t из $vps_n ожидаемых"
          ls -la out/
          # Хаб xsteer: по архиву на каждую VPS-архитектуру, тот же список, что и obfs.
          # Установщик тянет их по фиксированному имени, поэтому пропажа архива — это
          # тихий откат к прежнему релизу; барьер не даёт релизу выйти без них.
          h=$(ls out/steer-hub-*.tar.gz 2>/dev/null | wc -l)
          [ "$h" -eq "$vps_n" ] || {
            echo "::error::архивов steer-hub $h, а ожидалось $vps_n"
            ls -la out/ 2>/dev/null
            exit 1; }
          echo "собрано архивов steer-hub: $h из $vps_n ожидаемых"
          ls -la out/

      - name: Стенды src/ext на настоящей mbedtls (внутри образа сборки)
        # ПОКА НЕ БАРЬЕР, и это осознанно (R-063, поле risks). Стенды xsloop, spokematch и
        # hubmatch до сих пор прогонялись только руками и только на mbedtls 2.28, а здесь
        # впервые идут на 3.6.2 — той самой, которой собирается расширенный пакет. Блокирующий
        # барьер на непроверенной версии гасил бы релизы по своей же неуверенности, поэтому
        # первый шаг — прогнать и посмотреть. Когда прогон покажет зелёное, строка
        # continue-on-error снимается, и шаг встаёт барьером наравне с `make test`.
        continue-on-error: true
        run: |
          set -eu
          set -o pipefail
          # Образ здесь уже есть: его поднял шаг сборки (build.sh собирает его из
          # build/Dockerfile, если нет). Прогон идёт ВНУТРИ образа, а не на runner'е: у
          # runner'а своя mbedtls, и зелёное на ней про релиз не говорит ничего.
          #
          # Логика — в отдельном скрипте, а не строкой в `docker run -c`: тот же довод, что
          # у build/build-ext.sh, там экранирование внутри кавычек однажды стоило сборки.
          docker run --rm -v "$PWD:/src" -w /src --entrypoint sh \
            "${STEER_BUILDER_IMAGE:-steer-builder:mbedtls}" \
            /src/build/ext-test-image.sh 2>&1 | tee /tmp/ext-test.log || true
          # `|| true` не прощает отказ, а отдаёт решение проверке ниже: иначе падение прогона
          # обрывало бы шаг на set -e ДО неё, и в сводке релиза не оказалось бы ни строки о
          # том, что стенды не прошли, — только красный шаг без объяснения.
          #
          # Пропуск обязан быть виден. tests/ext-test.sh при ненайденной библиотеке выходит
          # НУЛЁМ (громкий пропуск — так задумано), и без этой проверки шаг был бы зелёным,
          # не прогнав ни одного стенда: ровно то, как молчаливо пропускался ui-harness в
          # splify2. Признак прохода — последняя строка самого скрипта.
          grep -q 'ext-test: все стенды прошли' /tmp/ext-test.log || {
            echo "::warning::стенды src/ext в этом релизе не прогнаны до конца — смотрите лог шага"
            exit 1; }

      - name: Зафиксировать версию в репозитории
        run: |
          set -eu
          # Чтобы репозиторий и релиз не расходились: тег vX.Y.Z должен указывать на
          # коммит, в котором VERSION действительно X.Y.Z.
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "Версия ${VERSION}"
            git push
          fi

      - name: Выложить пакеты роутера в ветку dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST: dist
        run: |
          set -eu
          # ЗАЧЕМ ВТОРАЯ ВЫКЛАДКА, КОГДА ЕСТЬ РЕЛИЗ. splify2#15: провайдер закрывает не
          # GitHub, а `githubusercontent.com` — и целиком: `raw.`, `objects.` и
          # `release-assets.` стоят на одних адресах Fastly (185.199.108-111.133). Прямая
          # ссылка релиза перенаправляет как раз на `release-assets`, поэтому у такого
          # человека движок нельзя ни поставить, ни обновить — ни install.sh, ни кнопкой в
          # splify2. Хосты самого GitHub (`api.` и `codeload.`, сеть 140.82.121.x) работают,
          # и оба умеют отдать файл из ветки: поштучно через contents API и архивом.
          #
          # Только пакеты роутера. Сборки для VPS (`steer-hub-*`, `steer-obfs-*`) едут в
          # СВОЮ ветку соседним шагом: эту роутер качает архивом ЦЕЛИКОМ, и лишние два
          # мегабайта платил бы каждый роутер, который до архива дойдёт.
          #
          # Ветка сиротская и переписывается каждым релизом: это канал выкладки, а не
          # история. Иначе архив рос бы каждым выпуском, а качает его роутер целиком.
          rm -rf /tmp/dist
          mkdir -p /tmp/dist
          cp out/*.apk out/*.ipk /tmp/dist/
          echo "$VERSION" > /tmp/dist/VERSION
          cd /tmp/dist
          git init -q -b "$DIST"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Пакеты ${VERSION}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$DIST:$DIST"

      - name: Выложить сборки VPS в ветку dist-vps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_VPS: dist-vps
        run: |
          set -eu
          # То же обещание, что у ветки dist, но для серверной половины. Раньше считалось,
          # что VPS этой беды не знает: «сервер стоит там, где не блокируют». Это неправда
          # для российского VPS, а он у людей обычный — и `server/xs_install.sh` качал хаб
          # ровно по той ссылке, что перенаправляет на release-assets.githubusercontent.com.
          # То есть у половины аудитории серверная часть не ставилась по той же причине, по
          # которой не ставилась роутерная, и отличить это от «сервер релизов лежит» было
          # нельзя: источник был один, и отказ звучал одинаково.
          #
          # СВОЯ ВЕТКА, А НЕ ТА ЖЕ. Ветку dist роутер качает архивом целиком (codeload), и
          # архивы для VPS весом под мегабайт каждый платил бы каждый такой роутер, ничего
          # не получая взамен. Установщик на VPS, наоборот, берёт ОДИН файл поштучно через
          # contents API, и размер ветки его не касается.
          rm -rf /tmp/dist-vps
          mkdir -p /tmp/dist-vps
          cp out/steer-hub-*.tar.gz /tmp/dist-vps/
          cp out/steer-obfs-*.tar.gz /tmp/dist-vps/
          echo "$VERSION" > /tmp/dist-vps/VERSION
          cd /tmp/dist-vps
          git init -q -b "$DIST_VPS"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Сборки VPS ${VERSION}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$DIST_VPS:$DIST_VPS"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: steer ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/*.apk
            out/*.ipk
            out/*.tar.gz
          body: |
            Движок маршрутизации по политикам для OpenWrt.

            **Какой пакет брать.** Имя файла содержит архитектуру — ту же, что показывает
            `apk --print-arch` на роутере.

            * `steer-*` — движок. Каналы, наборы адресов, доменные списки с fake-IP,
              failover между устройствами.
            * `steer-extended-*` — то же плюс собственный клиент VLESS/Reality с Vision,
              транспортами tcp/grpc/xhttp и своим TUN. Нужен, только если туннель поднимает
              сам движок; для готового wireguard или amneziawg достаточно базового.

            Пакеты взаимозаменяемы и конфликтуют между собой: `steer-extended` объявляет
            `provides: steer`, поэтому ставится поверх без удаления настроек.

            **Два формата.** `.apk` — для OpenWrt 24.10 и новее, `.ipk` — для 23.05, 22.03
            и всего, что осталось на opkg. Содержимое одинаковое, отличаются только
            метаданные пакета.

            ```sh
            # OpenWrt 24.10+
            apk add --allow-untrusted ./steer-extended-${{ env.VERSION }}-1_<arch>.apk
            # OpenWrt 23.05 и старше
            opkg install ./steer-extended-${{ env.VERSION }}-1_<arch>.ipk
            ```

            **`steer-obfs-*.tar.gz` — серверная половина обфускации, для VPS.** Нужна
            только выходу с `obfs`: она принимает поддельный TCP снаружи и отдаёт
            датаграммы локальному WireGuard. Компилятор на сервере больше не нужен —
            бинарник в архиве статический, тот же самый, что и в пакете для роутера.

            ```sh
            tar xzf steer-obfs-${{ env.VERSION }}-x86_64.tar.gz
            cd obfs-x86_64 && sudo sh install.sh --port 4567 --forward 127.0.0.1:51820
            ```

            **`steer-hub-*.tar.gz` — хаб звезды xsteer, для VPS.** Отдельная половина от
            obfs: здесь свой протокол (поддельный TCP с обликом TLS) и своя подкоманда
            `xsteer-hub`, которой в сборке для роутера нет. Имя архива без версии —
            установщик тянет его по фиксированному пути. Внутри бинарник, установщик и
            справка; распаковал и запустил, ключи хаб делает сам.

            ```sh
            tar xzf steer-hub-x86_64.tar.gz && sudo sh xs_install.sh
            ```
